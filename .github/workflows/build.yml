name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The Google Play upload key comes from the repository secrets (Settings → Secrets and variables → Actions):
      # UPLOAD_KEYSTORE_BASE64, UPLOAD_STORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD.
      - name: Get the Google Play upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "No upload key in the secrets: the Google Play bundle is signed with the repo key (fine for testing, not for uploading)."
          fi

      - name: Build the APK (GitHub version) and the bundle (Google Play version)
        env:
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease bundlePlayRelease --stacktrace
          cp app/build/outputs/apk/github/release/app-github-release.apk scrmoods.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab scrmoods-play.aab

      - name: Upload APK (Actions tab → this run → Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: scrmoods-apk
          path: scrmoods.apk

      # The file to upload in Google Play Console (Actions tab → this run → Artifacts → scrmoods-play-bundle).
      # Kept out of the public release, so only you can get it.
      - name: Upload the Google Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: scrmoods-play-bundle
          path: scrmoods-play.aab

      # On every push to main/master, replace the "latest" release so the APK
      # is always downloadable from the repo's Releases page (handy on the phone).
      - name: Publish to Releases → latest
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest scrmoods.apk \
            --title "scrmoods build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Download scrmoods.apk below and open it on your phone to install or update." \
            --target ${{ github.sha }} \
            --prerelease
